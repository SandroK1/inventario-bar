<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario del Bar</title>
<meta name="description" content="Inventario automatizzato del bar — funziona offline, dati salvati solo su questo dispositivo, nessun account richiesto.">
<meta name="theme-color" content="#A2611E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario Bar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EFF1E8; --surface:#FFFFFF; --surface-2:#F6F6EF; --border:#DBDECC;
  --ink:#182620; --ink-dim:#59695D; --ink-faint:#8B9A8C;
  --accent:#A2611E; --accent-ink:#FFF9F0; --accent-soft:#F1E1C4; --accent-soft-ink:#6B4212;
  --accent2:#3E6B57; --accent2-soft:#DCEBE1;
  --ok:#2C7A4B; --ok-soft:#DEF0E3;
  --warn:#A9740F; --warn-soft:#F5E7C4;
  --crit:#AE3B34; --crit-soft:#F6DEDA;
  --shadow:0 1px 2px rgba(24,38,32,.06), 0 10px 28px -14px rgba(24,38,32,.22);
  --radius:12px; --radius-sm:8px;
  --font-display:'IBM Plex Serif',Georgia,serif;
  --font-sans:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A15; --surface:#17231D; --surface-2:#1C2A22; --border:#2B3A31;
    --ink:#E7ECE4; --ink-dim:#9FAF9F; --ink-faint:#6C7C6D;
    --accent:#DA9F52; --accent-ink:#211404; --accent-soft:#3B2C15; --accent-soft-ink:#F0D6A8;
    --accent2:#75AD90; --accent2-soft:#1E3128;
    --ok:#66C08A; --ok-soft:#173A28;
    --warn:#E3AE44; --warn-soft:#3C2E11;
    --crit:#E38B85; --crit-soft:#3D201D;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#101A15; --surface:#17231D; --surface-2:#1C2A22; --border:#2B3A31;
  --ink:#E7ECE4; --ink-dim:#9FAF9F; --ink-faint:#6C7C6D;
  --accent:#DA9F52; --accent-ink:#211404; --accent-soft:#3B2C15; --accent-soft-ink:#F0D6A8;
  --accent2:#75AD90; --accent2-soft:#1E3128;
  --ok:#66C08A; --ok-soft:#173A28;
  --warn:#E3AE44; --warn-soft:#3C2E11;
  --crit:#E38B85; --crit-soft:#3D201D;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-sans);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
table{border-collapse:collapse;}
::selection{background:var(--accent-soft);}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
a{color:var(--accent);}

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:238px; flex-shrink:0; border-right:1px solid var(--border);
  padding:22px 14px 18px; display:flex; flex-direction:column; gap:18px;
  position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--surface);
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px;}
.brand-mark{font-size:22px; line-height:1;}
.brand-text{display:flex; flex-direction:column; gap:1px;}
.brand-name{font-family:var(--font-display); font-size:16px; font-weight:600;}
.brand-sub{font-size:11px; color:var(--ink-faint); letter-spacing:.02em;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav-btn{
  display:flex; align-items:center; gap:10px; text-align:left; padding:9px 10px;
  border-radius:var(--radius-sm); border:none; background:transparent; color:var(--ink-dim);
  cursor:pointer; font-weight:500; font-size:13.5px;
}
.nav-btn:hover{background:var(--surface-2); color:var(--ink);}
.nav-btn.active{background:var(--accent-soft); color:var(--accent-soft-ink);}
.nav-ico{width:18px; text-align:center; flex-shrink:0;}
.nav-badge{
  margin-left:auto; font-family:var(--font-mono); font-size:10.5px; padding:1px 6px;
  border-radius:99px; background:var(--crit-soft); color:var(--crit);
}
.sidebar-foot{margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--border); font-size:11px; color:var(--ink-faint);}
.sync-dot{display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--ok); margin-right:5px;}
.sync-dot.off{background:var(--ink-faint);}

.main{flex:1; min-width:0; padding:26px 30px 70px;}
.main-inner{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:22px;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-title{font-size:22px;}
.page-desc{color:var(--ink-dim); font-size:13px; margin-top:4px; max-width:60ch;}

@media (max-width: 880px){
  .app{flex-direction:column;}
  .sidebar{
    position:static; width:auto; height:auto; flex-direction:row; align-items:center;
    overflow-x:auto; padding:12px 10px; gap:14px; border-right:none; border-bottom:1px solid var(--border);
  }
  .brand{flex-shrink:0;}
  .nav{flex-direction:row; flex-shrink:0;}
  .nav-btn{white-space:nowrap;}
  .sidebar-foot{display:none;}
  .main{padding:18px 16px 60px;}
}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:6px;}
.stat-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
.stat-value{font-family:var(--font-mono); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat-value.crit{color:var(--crit);} .stat-value.warn{color:var(--warn);} .stat-value.ok{color:var(--ok);}
.stat-note{font-size:12px; color:var(--ink-dim);}

.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--ink); cursor:pointer; font-weight:600; font-size:13px;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{border-color:transparent; background:transparent;}
.btn.danger{color:var(--crit); border-color:var(--crit-soft);}
.btn.sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12px; font-weight:600; color:var(--ink-dim);}
.field .hint{font-size:11px; color:var(--ink-faint); font-weight:400;}
input[type=text],input[type=number],input[type=date],select,textarea{
  padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--ink); width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
.pill.ok{background:var(--ok-soft); color:var(--ok);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.crit{background:var(--crit-soft); color:var(--crit);}
.pill.n{background:var(--surface-2); color:var(--ink-faint);}
.pill.acc{background:var(--accent2-soft); color:var(--accent2);}

table.tbl{width:100%; font-size:13px;}
.tbl thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-faint); font-weight:600; padding:0 12px 8px; border-bottom:1px solid var(--border);
}
.tbl td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--surface-2);}
.tbl td.num,.tbl th.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.table-wrap{overflow-x:auto;}
.row-name{font-weight:600;}
.row-sub{font-size:11.5px; color:var(--ink-faint);}

.empty{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:28px 22px; color:var(--ink-dim);}
.empty .big{font-size:26px;}
.empty h3{font-size:15px; color:var(--ink);}
.empty p{margin:0; font-size:13px; max-width:52ch;}

.panel-overlay{position:fixed; inset:0; background:rgba(16,26,21,.38); display:flex; justify-content:flex-end; z-index:40;}
.panel{
  width:min(440px,100%); background:var(--surface); height:100%; overflow-y:auto;
  padding:22px 22px 40px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow);
  border-left:1px solid var(--border);
}
.panel-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.panel-close{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:18px; padding:2px;}
.tag-input-list{display:flex; flex-wrap:wrap; gap:6px;}
.tag-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:3px 8px 3px 10px; border-radius:99px; font-size:12px;}
.tag-chip button{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:13px; padding:0;}

.section-title{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.section-title h2{font-size:16px;}
.divider{height:1px; background:var(--border); border:none; margin:2px 0;}

.step-list{display:flex; flex-direction:column; gap:10px;}
.step{display:flex; gap:12px; align-items:flex-start;}
.step-num{
  flex-shrink:0; width:24px; height:24px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:600;
}
.step.done .step-num{background:var(--ok-soft); color:var(--ok);}
.step-body b{display:block; font-size:13.5px;}
.step-body span{font-size:12.5px; color:var(--ink-dim);}

.badge-month{font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border:1px solid var(--border); padding:3px 9px; border-radius:99px;}

.wizard-steps{display:flex; gap:6px; font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.wizard-steps .on{color:var(--accent);}

.dropzone{
  border:1.5px dashed var(--border); border-radius:var(--radius); padding:26px 16px; text-align:center;
  color:var(--ink-dim); font-size:13px; cursor:pointer; background:var(--surface-2);
}
.dropzone:hover{border-color:var(--accent);}

.chart-axis{stroke:var(--border); stroke-width:1;}
.chart-axis-text{fill:var(--ink-faint); font:10.5px var(--font-mono);}
.chart-zero{stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:2 3;}
.chart-bar-ok{fill:var(--ok);} .chart-bar-warn{fill:var(--warn);} .chart-bar-crit{fill:var(--crit);}
.chart-bar-exp{fill:var(--accent2-soft); stroke:var(--accent2); stroke-width:1;}
.chart-bar-cnt{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1;}
.chart-label{fill:var(--ink-dim); font:11px var(--font-sans); font-weight:600;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-dim); align-items:center;}
.legend-sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}

.search-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.search-bar input[type=text]{max-width:260px;}

.kv{display:flex; flex-direction:column; gap:2px;}
.kv .k{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
.kv .v{font-family:var(--font-mono); font-size:14px;}

.toast{
  position:fixed; bottom:18px; right:18px; background:var(--ink); color:var(--bg); padding:10px 16px;
  border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow); z-index:80;
}

@media (max-width:520px){
  .grid-stats{grid-template-columns:1fr 1fr;}
  .panel{width:100%;}
}
</style>
</head>
<body>

<div id="root">
  <div style="padding:60px 20px; text-align:center; font-family:var(--font-sans); color:var(--ink-dim);">Caricamento inventario…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function(){
"use strict";

/* ============================= STATE ============================= */
var S = {
  ready:false, dbOk:null,
  tab:'dashboard',
  settings:{name:'Il mio bar', currency:'$'},
  products:[], recipes:[], deliveries:[], events:[], sessions:[],
  activeSessionId:null, activeSessionItems:[],
  filterText:'', showInactive:false,
  panel:null,           // {type:'product'|'recipe'|'delivery', id:string|null}
  importWiz:null,       // csv import wizard state
  scan:null,            // photo-scan wizard state
  scanAvailable:true,   // photo scan uses a bundled OCR engine — always offered
  toast:null,
  productSort:'name',
};
var DB = null;          // set once the local (IndexedDB) store has loaded — see initLocalDb()
var todayStr = function(){ return new Date().toISOString().slice(0,10); };
var monthKeyOf = function(dateStr){ return (dateStr||todayStr()).slice(0,7); };
var unsubs = [];

/* ============================= UTIL ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n, d){ if(n==null||isNaN(n)) return '—'; d = d==null?2:d; var v=Number(n); var r = Math.round(v*Math.pow(10,d))/Math.pow(10,d); return r.toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:d}); }
function money(n){ if(n==null||isNaN(n)) return '—'; return S.settings.currency + num(n,2); }
function pct(n){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return (n>0?'+':'') + num(n,1) + '%'; }
function fmtDate(d){ if(!d) return '—'; var p=d.split('-'); return p.length===3? (p[2]+'/'+p[1]+'/'+p[0]) : d; }
function fmtMonth(m){ if(!m) return '—'; var p=m.split('-'); var names=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic']; return names[parseInt(p[1],10)-1]+' '+p[0]; }
function byId(list,id){ return (list||[]).find(function(x){ return x.id===id; }); }
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function uniqSorted(arr){ return Array.from(new Set(arr)); }
function clamp0(n){ return n<0?0:n; }
function setToast(msg){ S.toast = msg; render(); setTimeout(function(){ S.toast=null; render(); }, 2600); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ============================= COMPUTATION ============================= */
function activeProducts(){ return S.products.filter(function(p){ return p.active !== false; }); }

function deliveredSince(productId, sinceDate){
  var t=0;
  S.deliveries.forEach(function(d){ if(d.productId===productId && d.date >= sinceDate) t += Number(d.units)||0; });
  return t;
}
function consumedSince(productId, sinceDate){
  var t=0;
  S.events.forEach(function(ev){
    if(!ev.date || ev.date < sinceDate) return;
    (ev.perProduct||[]).forEach(function(row){ if(row.productId===productId) t += Number(row.units)||0; });
  });
  return t;
}
function expectedFor(p){
  var since = p.baselineDate || (p.createdAt||todayStr()).slice(0,10);
  var base = Number(p.baselineUnits)||0;
  return base + deliveredSince(p.id, since) - consumedSince(p.id, since);
}
function statusFor(p, expected){
  if(p.parLevel==null || p.parLevel==='' || isNaN(p.parLevel)) return {level:'n', label:'nessuna soglia'};
  var par = Number(p.parLevel);
  if(par<=0) return {level:'n', label:'nessuna soglia'};
  if(expected<=0) return {level:'crit', label:'esaurito'};
  var ratio = expected/par;
  if(ratio<0.5) return {level:'crit', label:'critico'};
  if(ratio<1) return {level:'warn', label:'sotto scorta'};
  return {level:'ok', label:'ok'};
}
function findRecipeByName(name){
  var n = normName(name);
  return S.recipes.find(function(r){
    if(normName(r.name)===n) return true;
    return (r.aliases||[]).some(function(a){ return normName(a)===n; });
  });
}
function consumptionFor(recipe, qty){
  qty = Number(qty)||0;
  if(recipe.type==='diretto'){
    return [{productId:recipe.productId, units: qty*(Number(recipe.unitsPerSale)||1)}];
  }
  return (recipe.ingredients||[]).map(function(ing){
    var prod = byId(S.products, ing.productId);
    var size = (prod && Number(prod.unitSizeMl)) || 1;
    return {productId:ing.productId, units: qty*Number(ing.ml||0)/size};
  });
}

/* ============================= LOCAL STORE (IndexedDB) =============================
   A tiny Firestore-shaped shim over IndexedDB, so the rest of the app (which was
   written against DB.doc()/DB.collection() with onSnapshot-style listeners) needs
   no further changes. Everything lives ONLY on this device/browser — there is no
   server and nothing is ever sent anywhere. */
var IDB_NAME = 'bar-inventario-db';
var IDB_STORE = 'docs';
var idbHandle = null;
var docStore = new Map();        // in-memory mirror of every document, path -> data
var docListeners = new Map();    // path -> Set(callback)
var collListeners = new Map();   // collectionPath -> Set(callback)

function genId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function openIdb(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('IndexedDB non disponibile in questo browser')); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){
      var idb = req.result;
      if(!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE, {keyPath:'path'});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('Impossibile aprire il database locale')); };
  });
}
function idbLoadAll(){
  return new Promise(function(resolve, reject){
    var tx = idbHandle.transaction(IDB_STORE, 'readonly');
    var req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = function(){ resolve(req.result || []); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbPut(path, data){
  return new Promise(function(resolve, reject){
    var tx = idbHandle.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({path:path, data:data});
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error); };
  });
}
function idbDeleteKey(path){
  return new Promise(function(resolve, reject){
    var tx = idbHandle.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(path);
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error); };
  });
}
function parentCollectionPath(path){ var parts = path.split('/'); return parts.slice(0,-1).join('/'); }
function directChildren(collPath){
  var prefix = collPath + '/';
  var out = [];
  docStore.forEach(function(data, p){
    if(p.indexOf(prefix) === 0){
      var rest = p.slice(prefix.length);
      if(rest.indexOf('/') === -1) out.push({id:rest, data:data});
    }
  });
  return out;
}
function notifyDocPath(path){
  var exists = docStore.has(path), data = docStore.get(path);
  var snap = {id:path.split('/').pop(), exists:exists, data:function(){return data;}, metadata:{fromCache:false,hasPendingWrites:false}};
  (docListeners.get(path)||new Set()).forEach(function(cb){ cb(snap); });
  notifyCollectionPath(parentCollectionPath(path));
}
function notifyCollectionPath(collPath){
  var children = directChildren(collPath);
  var docs = children.map(function(c){ return {id:c.id, exists:true, data:function(){return c.data;}, metadata:{fromCache:false,hasPendingWrites:false}}; });
  var snap = {docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}, metadata:{fromCache:false,hasPendingWrites:false}};
  (collListeners.get(collPath)||new Set()).forEach(function(cb){ cb(snap); });
}
function docRef(path){
  return {
    id: path.split('/').pop(),
    path: path,
    get: function(){
      var exists = docStore.has(path), data = docStore.get(path);
      return Promise.resolve({id:path.split('/').pop(), exists:exists, data:function(){return data;}});
    },
    set: function(data){
      var clean = JSON.parse(JSON.stringify(data));
      docStore.set(path, clean);
      notifyDocPath(path);
      return idbPut(path, clean);
    },
    update: function(data){
      if(!docStore.has(path)) return Promise.reject({code:'invalid_argument', message:'documento inesistente: '+path});
      var merged = Object.assign({}, docStore.get(path), JSON.parse(JSON.stringify(data)));
      docStore.set(path, merged);
      notifyDocPath(path);
      return idbPut(path, merged);
    },
    delete: function(){
      docStore.delete(path);
      notifyDocPath(path);
      return idbDeleteKey(path);
    },
    onSnapshot: function(next){
      if(!docListeners.has(path)) docListeners.set(path, new Set());
      docListeners.get(path).add(next);
      var exists = docStore.has(path), data = docStore.get(path);
      next({id:path.split('/').pop(), exists:exists, data:function(){return data;}, metadata:{fromCache:false,hasPendingWrites:false}});
      return function(){ var s = docListeners.get(path); if(s) s.delete(next); };
    },
    collection: function(sub){ return collRef(path+'/'+sub); }
  };
}
function collRef(path){
  return {
    path: path,
    doc: function(id){ return docRef(path+'/'+(id||genId())); },
    add: function(data){ var ref = docRef(path+'/'+genId()); return ref.set(data).then(function(){ return ref; }); },
    onSnapshot: function(next){
      if(!collListeners.has(path)) collListeners.set(path, new Set());
      collListeners.get(path).add(next);
      var children = directChildren(path);
      var docs = children.map(function(c){ return {id:c.id, exists:true, data:function(){return c.data;}}; });
      next({docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}});
      return function(){ var s = collListeners.get(path); if(s) s.delete(next); };
    },
    get: function(){
      var children = directChildren(path);
      return Promise.resolve({docs: children.map(function(c){ return {id:c.id, exists:true, data:function(){return c.data;}}; })});
    }
  };
}
async function initLocalDb(){
  idbHandle = await openIdb();
  var rows = await idbLoadAll();
  rows.forEach(function(r){ docStore.set(r.path, r.data); });
  DB = {doc:docRef, collection:collRef};
}

/* ============================= DB WIRING ============================= */
function watchCollection(name, target, cb){
  var ref = DB.collection(name);
  var un = ref.onSnapshot(function(snap){
    var arr = snap.docs.map(function(d){ var o=Object.assign({id:d.id}, d.data()); return o; });
    S[target] = arr;
    S.ready = true;
    if(cb) cb();
    render();
  }, function(err){
    console.error(name, err);
  });
  unsubs.push(un);
}

function initDb(){
  DB.doc('settings/general').onSnapshot(function(snap){
    if(snap.exists){ S.settings = Object.assign({name:'Il mio bar', currency:'$'}, snap.data()); }
    render();

  watchCollection('products','products');
  watchCollection('recipes','recipes');
  watchCollection('deliveries','deliveries');
  watchCollection('consumptionEvents','events');
  watchCollection('countSessions','sessions');
}

    root.innerHTML = '<div id="page-slot"></div><div id="panel-slot"></div><div id="toast-slot"></div>';

function withFocusPreserved(containerId, updateFn){
  var container = document.getElementById(containerId);
  var active = document.activeElement;
  var restoreId=null, restoreName=null, restoreSel=null;
  if(container && active && container.contains(active)){
    restoreId = active.id||null;
    restoreName = active.getAttribute && active.getAttribute('name');
    if(typeof active.selectionStart==='number'){ try{ restoreSel=[active.selectionStart, active.selectionEnd]; }catch(e){} }
  }
  updateFn();
  if(restoreId || restoreName){
    var sel = restoreId? ('#'+(window.CSS&&CSS.escape? CSS.escape(restoreId):restoreId)) : ('[name="'+restoreName+'"]');
    var el = container.querySelector(sel);
    if(el){ el.focus(); if(restoreSel){ try{ el.setSelectionRange(restoreSel[0], restoreSel[1]); }catch(e){} } }
  }
}

function render(){
  var root = document.getElementById('root');
  if(!S.ready){ root.innerHTML = '<div style="padding:60px 20px; text-align:center; color:var(--ink-dim);">Caricamento inventario…</div>'; return; }
  ensureShell(root);
  withFocusPreserved('page-slot', function(){
    document.getElementById('page-slot').innerHTML = renderShellInner();
  });
  var key = panelKeyOf(S.panel);
  if(key !== lastPanelKey){
    document.getElementById('panel-slot').innerHTML = S.panel ? renderPanel() : '';
    lastPanelKey = key;
    var focusEl = document.querySelector('#panel-slot .panel input, #panel-slot .panel select, #panel-slot .panel textarea');
    if(focusEl) focusEl.focus();
  }
  document.getElementById('toast-slot').innerHTML = S.toast ? '<div class="toast">'+esc(S.toast)+'</div>' : '';
}

function tabDashboard(){
  var products = activeProducts();
  var totalValue = 0, critCount=0, warnCount=0;
  var rows = products.map(function(p){
    var e = expectedFor(p);
    var st = statusFor(p,e);
    if(st.level==='crit') critCount++;
    if(st.level==='warn') warnCount++;
    if(p.costPerUnit) totalValue += e*Number(p.costPerUnit);
    return {p:p, e:e, st:st};
  });
  rows.sort(function(a,b){
    var order={crit:0,warn:1,n:2,ok:3};
    if(order[a.st.level]!==order[b.st.level]) return order[a.st.level]-order[b.st.level];
    return a.p.name.localeCompare(b.p.name);
  });

  var openSessions = S.sessions.filter(function(s){ return s.status!=='closed'; }).length;
  var closedSessions = S.sessions.filter(function(s){ return s.status==='closed'; }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var lastSession = closedSessions[0];
  var monthsClosed = closedSessions.length;

  var html = '';
  html += '<div class="page-head"><div><h1 class="page-title">Dashboard</h1><p class="page-desc">Stato della giacenza calcolata automaticamente da consegne e vendite registrate.</p></div>';
  html += settingsInline();
  html += '</div>';

  if(products.length===0){
    html += onboardingCard();
  } else {
    html += '<div class="grid-stats">';
    html += statTile('Referenze attive', products.length, null, null);
    html += statTile('Valore giacenza stimato', money(totalValue), null, 'in base ai costi impostati');
    html += statTile('Sotto scorta', warnCount+critCount, (critCount>0?'crit':(warnCount>0?'warn':'ok')), critCount+' critiche, '+warnCount+' in attenzione');
    html += statTile('Mesi conteggiati', monthsClosed, monthsClosed>=3?'ok':null, monthsClosed<3?('mancano '+(3-monthsClosed)+' al conteggio automatico') : 'inventario fisico non più necessario');
    html += '</div>';

    html += '<div class="card card-pad">';
    html += '<div class="section-title"><h2>Giacenza per prodotto</h2><span class="row-sub">calcolata: scorta iniziale + consegne − vendite registrate</span></div>';
    html += '<div class="table-wrap"><table class="tbl"><thead><tr><th>Prodotto</th><th>Categoria</th><th class="num">Attesa</th><th class="num">Soglia</th><th>Stato</th></tr></thead><tbody>';
    rows.slice(0,12).forEach(function(r){
      html += '<tr><td><div class="row-name">'+esc(r.p.name)+'</div><div class="row-sub">'+esc(r.p.unitLabel||'unità')+'</div></td>';
      html += '<td>'+esc(r.p.category||'—')+'</td>';
      html += '<td class="num">'+num(r.e,1)+'</td>';
      html += '<td class="num">'+(r.p.parLevel? num(r.p.parLevel,0):'—')+'</td>';
      html += '<td><span class="pill '+r.st.level+'">'+r.st.label+'</span></td></tr>';
    });
    html += '</tbody></table></div>';
    if(rows.length>12) html += '<div style="margin-top:10px;"><button class="btn ghost sm" onclick="App.setTab(\'products\')">Vedi tutti i '+rows.length+' prodotti →</button></div>';
    html += '</div>';

    if(lastSession){
      html += '<div class="card card-pad">';
      html += '<div class="section-title"><h2>Ultimo conteggio fisico</h2><span class="badge-month">'+fmtMonth(lastSession.month)+'</span></div>';
      var sum = lastSession.summary||{};
      html += '<div class="grid-stats" style="margin-top:10px;">';
      html += statTile('Atteso totale', num(sum.totalExpectedUnits,1)+' u.', null, null);
      html += statTile('Contato totale', num(sum.totalCountedUnits,1)+' u.', null, null);
      html += statTile('Scarto medio', pct(sum.avgDiffPct), Math.abs(sum.avgDiffPct||0)>10?'warn':'ok', null);
      html += statTile('Voci fuori soglia', sum.itemsFlagged||0, (sum.itemsFlagged>0?'warn':'ok'), null);
      html += '</div></div>';
    }
  }

  html += processExplainer(monthsClosed);
  return html;
}

function renderSessionDetail(s){
  var items = S.activeSessionItems.slice().sort(function(a,b){ return (a.productName||'').localeCompare(b.productName||''); });
  var filled = items.filter(function(i){ return i.countedUnits!=null; }).length;
  var html = '<div class="card card-pad">';
  html += '<div class="section-title"><h2>Conteggio del '+fmtDate(s.date)+'</h2><span class="badge-month">'+fmtMonth(s.month)+'</span></div>';
  html += '<p class="row-sub" style="margin-top:4px;">Inserisci la quantità contata fisicamente per ogni prodotto. '+filled+'/'+items.length+' completati.</p>';
  html += '<div class="table-wrap" style="margin-top:10px;"><table class="tbl"><thead><tr><th>Prodotto</th><th class="num">Atteso</th><th class="num">Contato</th><th class="num">Scarto</th></tr></thead><tbody>';
  items.forEach(function(it){
    var diff = it.countedUnits!=null ? (it.countedUnits - it.expectedUnits) : null;
    var diffPct = (diff!=null) ? (it.expectedUnits!==0 ? diff/it.expectedUnits*100 : (it.countedUnits>0?100:0)) : null;
    var tone = diff==null?'':(Math.abs(diffPct)>15?'crit':(Math.abs(diffPct)>5?'warn':'ok'));
    html += '<tr><td>'+esc(it.productName)+'<div class="row-sub">'+esc(it.unitLabel||'')+'</div></td>';
    html += '<td class="num">'+num(it.expectedUnits,1)+'</td>';
    html += '<td class="num"><input type="number" step="0.1" style="width:90px; text-align:right;" value="'+(it.countedUnits!=null?it.countedUnits:'')+'" onchange="App.setCountedUnits(\''+s.id+'\',\''+it.id+'\',this.value)"></td>';
    html += '<td class="num">'+(diff!=null? '<span class="pill '+tone+'">'+pct(diffPct)+'</span>' : '—')+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="btn-row" style="margin-top:16px;">';
  html += '<button class="btn primary" onclick="App.closeSession(\''+s.id+'\')">Chiudi conteggio e aggiorna giacenza</button>';
  html += '<button class="btn ghost" onclick="App.exitSession()">Torna indietro</button>';
  if(s.status==='closed') html += '<button class="btn" onclick="App.exportSession(\''+s.id+'\')">Esporta CSV</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function historyChart(sessions){
  var W=Math.max(560, sessions.length*90), H=220, padL=44, padR=16, padT=16, padB=34;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  var maxAbs = Math.max(10, Math.max.apply(null, sessions.map(function(s){ return Math.abs((s.summary||{}).avgDiffPct||0); })));
  maxAbs = Math.ceil(maxAbs/5)*5;
  var zeroY = padT + innerH/2;
  var scale = (innerH/2)/maxAbs;
  var bw = innerW/sessions.length*0.5;
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; max-width:'+W+'px;" role="img" aria-label="Scarto medio per mese">';
  svg += '<line class="chart-zero" x1="'+padL+'" y1="'+zeroY+'" x2="'+(W-padR)+'" y2="'+zeroY+'"/>';
  [-maxAbs, -maxAbs/2, maxAbs/2, maxAbs].forEach(function(v){
    var y = zeroY - v*scale;
    svg += '<line class="chart-axis" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    svg += '<text class="chart-axis-text" x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end">'+(v>0?'+':'')+v+'%</text>';
  });
  sessions.forEach(function(s,i){
    var v = (s.summary||{}).avgDiffPct||0;
    var cx = padL + innerW*(i+0.5)/sessions.length;
    var h = Math.abs(v)*scale;
    var y = v>=0 ? zeroY-h : zeroY;
    var cls = Math.abs(v)>15?'chart-bar-crit':(Math.abs(v)>5?'chart-bar-warn':'chart-bar-ok');
    svg += '<rect class="'+cls+'" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1.5)+'" rx="3"/>';
    svg += '<text class="chart-label" x="'+cx+'" y="'+(v>=0? y-6 : y+h+14)+'" text-anchor="middle">'+pct(v)+'</text>';
    svg += '<text class="chart-axis-text" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+fmtMonth(s.month)+'</text>';
  });
  svg += '</svg>';
  var legend = '<div class="legend" style="margin-top:8px;"><span><span class="legend-sw" style="background:var(--ok)"></span>scarto ≤5%</span><span><span class="legend-sw" style="background:var(--warn)"></span>5–15%</span><span><span class="legend-sw" style="background:var(--crit)"></span>&gt;15%</span></div>';
  return '<div class="section-title"><h2>Scarto medio per mese</h2></div><div style="overflow-x:auto; margin-top:6px;">'+svg+'</div>'+legend;
}

App.wizAnalyze = function(){
  var w = S.importWiz;
  var agg = {};
  w.rows.forEach(function(r){
    var name = (r[w.colName]||'').toString().trim();
    var qty = parseFloat((r[w.colQty]||'0').toString().replace(',','.'));
    if(!name || isNaN(qty)) return;
    agg[name] = (agg[name]||0)+qty;
  });
  var matched=[], unmatched=[], perProductMap={};
  Object.keys(agg).forEach(function(name){
    var qty = agg[name];
    var recipe = findRecipeByName(name);
    if(!recipe){ unmatched.push({name:name, qty:qty}); return; }
    matched.push({name:name, qty:qty, recipeId:recipe.id});
    consumptionFor(recipe, qty).forEach(function(row){
      if(!perProductMap[row.productId]) perProductMap[row.productId] = 0;
      perProductMap[row.productId] += row.units;
    });
  });
  var perProduct = Object.keys(perProductMap).map(function(pid){
    var prod = byId(S.products,pid);
    return {productId:pid, name: prod?prod.name:'(prodotto eliminato)', units:perProductMap[pid]};
  }).sort(function(a,b){return b.units-a.units;});
  w.matched = matched; w.unmatched = unmatched; w.perProduct = perProduct;
  w.step = 'review';
  render();
};

    perProduct: w.perProduct.map(function(p){return {productId:p.productId, name:p.name, units:p.units};}),

/* ---- photo scan: local OCR (Tesseract.js), entirely on-device, no external service ---- */
var CATEGORY_KEYWORDS = [
  {cat:'Birre', words:['BIRRA','BEER','LAGER','PILSNER','WEISS','STOUT','IPA',' ALE ']},
  {cat:'Vini', words:['VINO','WINE','ROSSO','BIANCO','ROSATO','CHARDONNAY','MERLOT','SAUVIGNON','CABERNET','PINOT','CHIANTI','MONTEPULCIANO']},
  {cat:'Bollicine', words:['PROSECCO','SPUMANTE','CHAMPAGNE','CAVA','BRUT','ASTI','FRANCIACORTA']},
  {cat:'Analcolici', words:['ACQUA','WATER','SUCCO','JUICE',' COLA','TONICA','TONIC','SODA','GINGER','ENERGY','SPRITE','FANTA']},
  {cat:'Liquori', words:['GIN','VODKA','RUM','WHISKY','WHISKEY','TEQUILA','COGNAC','BRANDY','LIQUORE','LIQUEUR','AMARO','GRAPPA','VERMOUTH','APERITIVO','SAMBUCA']},
];
function guessCategory(text){
  var up = ' '+text.toUpperCase().replace(/\s+/g,' ')+' ';
  for(var i=0;i<CATEGORY_KEYWORDS.length;i++){
    for(var j=0;j<CATEGORY_KEYWORDS[i].words.length;j++){
      if(up.indexOf(CATEGORY_KEYWORDS[i].words[j])>=0) return CATEGORY_KEYWORDS[i].cat;
    }
  }
  return '';
}
function guessVolumeMl(text){
  var ml = text.match(/(\d{2,5})\s?m[il1]\b/i);
  if(ml) return parseInt(ml[1],10);
  var cl = text.match(/(\d{1,3}(?:[.,]\d)?)\s?cl\b/i);
  if(cl) return Math.round(parseFloat(cl[1].replace(',','.'))*10);
  var l = text.match(/(\d(?:[.,]\d{1,2})?)\s?[lL]\b/);
  if(l) return Math.round(parseFloat(l[1].replace(',','.'))*1000);
  return null;
}
function guessName(text){
  var lines = text.split(/\r?\n/).map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean);
  var candidates = lines.filter(function(l){ return /[A-Za-zÀ-ÿ]{3,}/.test(l) && l.replace(/[^A-Za-zÀ-ÿ]/g,'').length>=3 && l.length<=48; });
  if(candidates.length===0) return '';
  var top = candidates.slice(0,6).slice();
  top.sort(function(a,b){ return b.length-a.length; });
  return top[0];
}

var ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = (async function(){
      if(typeof Tesseract==='undefined') throw new Error('lib_unavailable');
      return await Tesseract.createWorker(['eng','ita']);
    })();
    ocrWorkerPromise.catch(function(){ ocrWorkerPromise = null; }); // let a later attempt retry after a load failure
  }
  return ocrWorkerPromise;
}

function revokeScanUrls(scan){
  if(!scan) return;
  (scan.rows||[]).forEach(function(r){ if(r.previewUrl){ try{ URL.revokeObjectURL(r.previewUrl); }catch(e){} } });
}

function runScanQueue(rows){
  (async function(){
    var worker;
    try{
      worker = await getOcrWorker();
    }catch(e){
      rows.forEach(function(row){
        row.status='error'; row.include=false;
        row.errorMsg = 'Serve una connessione internet la prima volta, per scaricare il motore di lettura. Riprova quando sei online, oppure inserisci i dati a mano.';
      });
      if(S.scan){ S.scan.doneCount = rows.length; S.scan.step='review'; }
      render();
      return;
    }
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      if(!S.scan) return; // scan cancelled mid-flight
      try{
        var result = await worker.recognize(row.file);
        var text = (result && result.data && result.data.text) || '';
        row.rawText = text.trim();
        row.name = guessName(text);
        row.category = guessCategory(text);
        var ml = guessVolumeMl(text);
        row.unitSizeMl = (ml!=null) ? ml : '';
        if(row.name){ row.status='ok'; row.confidence='media'; }
        else { row.status='error'; row.include=false; row.errorMsg='Testo poco chiaro — guarda cosa è stato letto qui sotto, o inserisci i dati a mano.'; }
      }catch(e){
        row.status='error'; row.include=false;
        row.errorMsg = 'Errore nella lettura di questa foto — inserisci i dati a mano.';
      }
      if(S.scan) S.scan.doneCount = (S.scan.doneCount||0)+1;
      render();
    }
    if(S.scan) S.scan.step='review';
    render();
  })();
}

    html += '<div class="field"><label>Nome</label><input type="text" value="'+escAttr(r.name)+'" placeholder="Nome prodotto" oninput="App.updateScanRow(\''+r.id+'\',\'name\',this.value)"></div>';
    html += '<div class="field"><label>Categoria</label><input type="text" list="scan-cat-list" value="'+escAttr(r.category)+'" oninput="App.updateScanRow(\''+r.id+'\',\'category\',this.value)"><datalist id="scan-cat-list">'+cats.map(function(c){return '<option value="'+escAttr(c)+'">';}).join('')+'</datalist></div>';
    html += '<div class="field"><label>Formato (ml)</label><input type="number" step="any" value="'+escAttr(r.unitSizeMl)+'" oninput="App.updateScanRow(\''+r.id+'\',\'unitSizeMl\',this.value)"></div>';
    html += '<div class="field"><label>Giacenza iniziale</label><input type="number" step="any" value="'+escAttr(r.baselineUnits)+'" oninput="App.updateScanRow(\''+r.id+'\',\'baselineUnits\',this.value)"></div>';
    html += '</div>';
    html += '<label class="checkline"><input type="checkbox" '+(r.include?'checked':'')+' onchange="App.toggleScanRowInclude(\''+r.id+'\',this.checked)"> aggiungi al catalogo</label>';
    if(r.rawText) html += '<details style="margin-top:2px;"><summary class="row-sub" style="cursor:pointer;">testo letto sulla foto</summary><pre style="white-space:pre-wrap; font-family:inherit; font-size:12px; color:var(--ink-dim); margin:6px 0 0; max-height:120px; overflow:auto;">'+esc(r.rawText)+'</pre></details>';
    html += '</div>';
    html += '<button type="button" class="btn ghost sm" onclick="App.removeScanRow(\''+r.id+'\')" title="Rimuovi">✕</button>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="btn-row" style="margin-top:16px;">';
  html += '<button class="btn primary" onclick="App.confirmScan()">Aggiungi '+included+' al catalogo</button>';
  html += '<label class="btn ghost sm" style="cursor:pointer;">+ Aggiungi altre foto<input type="file" accept="image/*" multiple capture="environment" style="display:none" onchange="App.addMorePhotos(this.files); this.value=\'\';"></label>';
  html += '<button class="btn ghost" onclick="App.cancelScan()">Annulla</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ============================= BOOT ============================= */
async function boot(){
  try{
    await initLocalDb();
  }catch(e){ DB = null; console.error(e); }
  if(!DB){
    S.dbOk = false;
    S.ready = true;
    document.getElementById('root').innerHTML = '<div style="max-width:520px;margin:60px auto;text-align:center;padding:0 20px;font-family:var(--font-sans);color:var(--ink-dim);"><h2 style="font-family:var(--font-display);color:var(--ink);margin-bottom:10px;">Memoria locale non disponibile</h2><p>Questo browser non permette di salvare dati in locale (succede ad es. in navigazione privata/incognito). Apri l&rsquo;app in una finestra normale del browser per usare l&rsquo;inventario.</p></div>';
    return;
  }
  S.dbOk = true;
  initDb();
  window.App = App;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
window.App = App;
boot();
})();
</script>
